[package]
name = "rust_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.3"
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
lazy_static = "1.4.0"
dotenv = "0.15.0"
reqwest = { version = "0.13.5", features = ["json"] }
